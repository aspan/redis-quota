services:
  valkey:
    image: 'valkey/valkey:latest'
    # Appends every write to a log in /data as well as taking snapshots, so little is lost on a restart
    command: ['valkey-server', '--appendonly', 'yes']
    ports:
      - '6379'
    volumes:
      # Keeps quota definitions and usage when the container is removed
      - 'valkey-data:/data'
    labels:
      # Spring Boot detects Redis-compatible services by image name, which does not include Valkey
      org.springframework.boot.service-connection: redis

  postgres:
    # Pinned to a major version, since a newer major cannot read an older one's data directory
    image: 'postgres:18'
    environment:
      # Local development only; Spring Boot reads these to connect
      POSTGRES_DB: quota
      POSTGRES_USER: quota
      POSTGRES_PASSWORD: quota
    ports:
      - '5432'
    volumes:
      # Keeps users and roles when the container is removed; PostgreSQL 18 images keep their data under this path
      - 'postgres-data:/var/lib/postgresql'

volumes:
  valkey-data:
  postgres-data:
