# Admin UI account for tests and ./mvnw spring-boot:test-run
spring.security.user.name=admin
spring.security.user.roles=ADMIN

# The password is kept out of the repository, in config/local.properties (spring.security.user.password=...)
spring.config.import=optional:file:./config/local.properties

# Open the app in the default browser when ./mvnw spring-boot:test-run starts in development mode
vaadin.launch-browser=true
