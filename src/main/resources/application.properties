spring.application.name=redis

# Languages of the admin UI, each with a translations_<locale>.properties file in vaadin-i18n;
# the first is used for browsers that accept none of them
quota.ui.i18n.locales=en,sv

# Flyway creates the schema from db/migration; Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
